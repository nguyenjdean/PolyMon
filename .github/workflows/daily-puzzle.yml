name: Generate Daily Puzzle

on:
  schedule:
    # Runs at 06:45 UTC every day (2:45 AM EDT / 1:45 AM EST)
    # Running 15 minutes before 3:00 AM ensures the data is ready when the website rolls over.
    - cron: '45 6 * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push to the repository

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Checkout old data
        uses: actions/checkout@v4
        with:
          ref: daily-data
          path: old_data
        continue-on-error: true
        
      - name: Generate Puzzle Data
        run: |
          export TZ="America/New_York"
          TODAY=$(date +%Y-%m-%d)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          
          # Restore previous days' data so we don't have to regenerate them
          mkdir -p data
          if [ -d "old_data/data" ]; then
            cp -r old_data/data/* data/ || true
          fi
          
          echo "Generating puzzle for today ($TODAY)"
          npx tsx scripts/generateDaily.ts $TODAY
          
          # Clean up old data to prevent the branch from growing infinitely
          for d in data/*/; do
            folder=$(basename "$d")
            # Keep ONLY today and yesterday
            if [ "$folder" != "$TODAY" ] && [ "$folder" != "$YESTERDAY" ]; then
              echo "Removing old puzzle data: $folder"
              rm -rf "$d"
            fi
          done
        
      - name: Publish to daily-data branch
        run: |
          # Set up git user
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # We only want to push the `data` folder to avoid bloating the main repository history.
          mkdir temp_data
          mv data temp_data/
          
          git checkout --orphan daily-data
          # Remove all tracked files from index
          git rm -rf .
          
          # Move data back
          mv temp_data/data .
          
          # Add and commit BOTH days (keeps history size fixed)
          git add data/
          git commit -m "Daily puzzle data for $(date +'%Y-%m-%d')"
          
          # Force push completely overwrites the branch, ensuring it stays small
          git push -f origin daily-data
